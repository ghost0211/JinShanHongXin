name: Release All Platforms (Android + Windows + Web OTA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve release tag and semver
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${RAW_TAG#refs/tags/}"
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-web-ota:
    needs: resolve-meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build frontend with release version and run tests
        env:
          JINSHAN_APP_VERSION: ${{ needs.resolve-meta.outputs.version }}
        run: |
          npm run build
          node --test packages/game-core/dist/__tests__/*.test.js apps/client/test/*.test.mjs

      - name: Package Web OTA bundle
        env:
          JINSHAN_APP_VERSION: ${{ needs.resolve-meta.outputs.version }}
        run: node scripts/build-web-bundle.mjs --version "${{ needs.resolve-meta.outputs.version }}" --tag "${{ needs.resolve-meta.outputs.tag }}" --out release-web

      - uses: actions/upload-artifact@v4
        with:
          name: release-web-ota
          path: release-web/jinshan-web-bundle-*.zip
          if-no-files-found: error

  build-android:
    needs: resolve-meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK build-tools and platform 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          BUILD_TOOLS_DIR="$(ls -d "$SDK_ROOT"/build-tools/35.* "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          if [ -f "$SDK_ROOT/platforms/android-35/android.jar" ]; then
            echo "ANDROID_JAR=$SDK_ROOT/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - name: Build frontend & Android APK
        env:
          JINSHAN_APP_VERSION: ${{ needs.resolve-meta.outputs.version }}
          ANDROID_APK_OUT: release-android/jinshan-hongxin-${{ needs.resolve-meta.outputs.tag }}.apk
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p release-android
          npm run build:apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: release-android/jinshan-hongxin-*.apk
          if-no-files-found: error

  build-windows:
    needs: resolve-meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri

      - run: npm ci

      - name: Stamp release version into Windows Tauri manifests
        run: node scripts/stamp-windows-version.mjs "${{ needs.resolve-meta.outputs.version }}"

      - name: Build workspace and run tests
        env:
          JINSHAN_APP_VERSION: ${{ needs.resolve-meta.outputs.version }}
        run: |
          npm run build
          node --test packages/game-core/dist/__tests__/*.test.js apps/client/test/*.test.mjs

      - name: Lint and test Rust desktop shell
        run: |
          cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --all-targets -- -D warnings
          npm --workspace=@jinshan/windows run test:rust

      - name: Build Windows NSIS installer & portable ZIP
        shell: pwsh
        env:
          JINSHAN_APP_VERSION: ${{ needs.resolve-meta.outputs.version }}
          TAG: ${{ needs.resolve-meta.outputs.tag }}
        run: |
          npm run build:win
          New-Item -ItemType Directory -Force -Path "release-windows" | Out-Null
          $nsis = Get-ChildItem "apps/windows/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "Expected NSIS installer not found" }
          Copy-Item $nsis.FullName "release-windows/jinshan-hongxin-windows-$env:TAG-setup.exe"

          $exe = "apps/windows/src-tauri/target/release/jinshan-hongxin-windows.exe"
          if (-not (Test-Path $exe)) { throw "Expected release binary not found: $exe" }
          $outDir = "apps/windows/dist-portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item $exe "$outDir/金山打红心.exe"
          Copy-Item "apps/windows/README.md" "$outDir/使用说明.md"
          Compress-Archive -Path "$outDir/*" -DestinationPath "release-windows/jinshan-hongxin-windows-$env:TAG-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-bundle
          path: |
            release-windows/jinshan-hongxin-windows-*-setup.exe
            release-windows/jinshan-hongxin-windows-*-portable.zip
          if-no-files-found: error

  publish-release:
    needs: [resolve-meta, build-web-ota, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: release-web-ota
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: release-android-apk
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: release-windows-bundle
          path: release-assets

      - name: Generate finalized update-manifest.json with SHA-256 checksums
        run: |
          node scripts/generate-update-manifest.mjs \
            --dir release-assets \
            --tag "${{ needs.resolve-meta.outputs.tag }}"
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-meta.outputs.tag }}
          name: 金山打红心 · 打黑心 ${{ needs.resolve-meta.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
