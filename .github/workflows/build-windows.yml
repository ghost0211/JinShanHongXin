name: Build Windows Client (Tauri 2)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-client
    paths:
      - 'apps/windows/**'
      - 'apps/client/**'
      - 'packages/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'apps/windows/**'
      - 'apps/client/**'
      - 'packages/**'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and build workspace
        run: npm run build

      - name: Run game-core & client unit tests
        run: node --test packages/game-core/dist/__tests__/*.test.js apps/client/test/*.test.mjs

      - name: Lint and test Rust desktop shell
        run: |
          cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --all-targets -- -D warnings
          npm --workspace=@jinshan/windows run test:rust

      - name: Build Windows NSIS installer & binary
        run: npm run build:win

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $exe = "apps/windows/src-tauri/target/release/jinshan-hongxin-windows.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected release binary not found: $exe"
          }
          $outDir = "apps/windows/dist-portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item $exe "$outDir/金山打红心.exe"
          Copy-Item "apps/windows/README.md" "$outDir/使用说明.md"
          Compress-Archive -Path "$outDir/*" -DestinationPath "apps/windows/jinshan-hongxin-windows-x64-portable.zip" -Force

      - name: Upload Windows Installer (NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: jinshan-hongxin-windows-installer
          path: apps/windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jinshan-hongxin-windows-portable
          path: apps/windows/jinshan-hongxin-windows-x64-portable.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/jinshan-hongxin-windows-x64-portable.zip
