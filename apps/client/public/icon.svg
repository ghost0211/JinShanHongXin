<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#2d4c46" />
      <stop offset="58%" stop-color="#16292a" />
      <stop offset="100%" stop-color="#0b0f0e" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e2a8" />
      <stop offset="55%" stop-color="#d6b26a" />
      <stop offset="100%" stop-color="#9a7738" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#fffdf6" />
      <stop offset="100%" stop-color="#efe3c8" />
    </linearGradient>
    <linearGradient id="cinnabar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2563f" />
      <stop offset="100%" stop-color="#9a2618" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <circle cx="64" cy="64" r="51" fill="none" stroke="url(#gold)" stroke-opacity="0.32" stroke-width="1.4" />
  <circle cx="64" cy="64" r="47" fill="none" stroke="url(#gold)" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 4" />

  <!-- back card -->
  <g transform="rotate(-13 52 64)">
    <rect x="28" y="32" width="44" height="64" rx="6" fill="#161412" stroke="url(#gold)" stroke-width="2" />
    <rect x="32.5" y="36.5" width="35" height="55" rx="3.5" fill="none" stroke="#d6b26a" stroke-opacity="0.5" stroke-width="1" />
    <path d="M50 52c-5 6.4-11 10-11 14.8 0 3.2 2.5 5.4 5.4 5.4 1.9 0 3.5-.9 4.4-2.3l-1.8 6.6h6l-1.8-6.6c.9 1.4 2.5 2.3 4.4 2.3 2.9 0 5.4-2.2 5.4-5.4C61 62 55 58.4 50 52Z" fill="url(#gold)" />
  </g>

  <!-- front card: heart five -->
  <g transform="rotate(7 74 62)">
    <rect x="50" y="26" width="48" height="70" rx="7" fill="url(#paper)" stroke="#d6b26a" stroke-width="2.2" />
    <text x="55.5" y="43" font-size="15" font-weight="900" font-family="Georgia, 'Noto Serif', serif" fill="#c2312a">5</text>
    <path d="M59.6 52.5s-4.6-3-4.6-5.7c0-1.4 1.1-2.4 2.3-2.4.9 0 1.8.5 2.3 1.3.5-.8 1.4-1.3 2.3-1.3 1.2 0 2.3 1 2.3 2.4 0 2.7-4.6 5.7-4.6 5.7Z" fill="#c2312a" />
    <path d="M75 82s-14.5-9.6-14.5-19c0-5 4-8.2 8-8.2 3 0 5.2 1.7 6.5 4.1 1.3-2.4 3.5-4.1 6.5-4.1 4 0 8 3.2 8 8.2 0 9.4-14.5 19-14.5 19Z" fill="url(#cinnabar)" />
  </g>

  <!-- cinnabar seal -->
  <g transform="rotate(-6 86 92)">
    <rect x="72" y="78" width="28" height="28" rx="3" fill="url(#cinnabar)" />
    <rect x="74.5" y="80.5" width="23" height="23" rx="1.5" fill="none" stroke="#fff1dc" stroke-opacity="0.8" stroke-width="1.2" />
    <text x="86" y="91" text-anchor="middle" font-size="10" font-weight="900" font-family="'Noto Serif CJK SC', 'Noto Serif SC', 'Songti SC', serif" fill="#fff4e4">金</text>
    <text x="86" y="101.5" text-anchor="middle" font-size="10" font-weight="900" font-family="'Noto Serif CJK SC', 'Noto Serif SC', 'Songti SC', serif" fill="#fff4e4">山</text>
  </g>
</svg>
