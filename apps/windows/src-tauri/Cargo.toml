[package]
name = "jinshan-hongxin-windows"
version = "0.1.0"
description = "金山打红心 · 打黑心 Windows 桌面客户端"
authors = ["JinShanHongXin Contributors"]
edition = "2021"

[lib]
name = "jinshan_hongxin_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
