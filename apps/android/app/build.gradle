plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jinshan.hongxin'
    compileSdk 35

    defaultConfig {
        applicationId "com.jinshan.hongxin"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
